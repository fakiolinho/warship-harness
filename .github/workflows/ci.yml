name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # No TTY on a runner, so an "ask" verdict must resolve to "declined"
  # rather than blocking on input(). This is the unattended posture the
  # harness ships for; CI is where we prove it holds.
  WARSHIP_NONINTERACTIVE: "1"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check --output-format=github .
      - name: Formatting is deterministic, so CI can assert it
        run: ruff format --check --diff .

  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # One macOS leg: the harness touches paths and subprocesses, and
          # most contributors here are on a Mac.
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Smoke test (no API key)
        run: python selfcheck.py

      - name: Test suite (no API key, no network)
        run: pytest

      - name: Gate eval (behaviour, not wiring)
        # The suite proves the gate runs. This proves it catches things.
        # Two corpora are scored: the one the rules were written against
        # (a regression test) and a held-out one (the measurement). The
        # floor applies to both, so weakening the rules fails the build
        # instead of quietly lowering a number nobody is watching.
        run: python evals/run_gate_eval.py --min-deny-recall 1.0

      - name: Mission dry run against a scripted model
        # Proves the real entrypoint works end to end: resume prompt,
        # streaming, checkpointing, ledger outcome, FinOps report.
        run: python tests/dry_run.py

      - name: Fail if a run dirtied the working tree
        # Runtime output (ledger.jsonl, state.json, artifacts/) is
        # gitignored. If this trips, something is writing where it must not.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::working tree is dirty after the test run"
            git status --porcelain
            exit 1
          fi

  container:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        # SECURITY.md points at this image as the real boundary, so it
        # cannot go untested. A runner has a Docker daemon even when a
        # laptop does not.
        run: docker build -t warship-harness .

      - name: The harness works inside the container
        run: docker run --rm warship-harness python selfcheck.py

      - name: The mission entrypoint is present and answers
        # Not the dry run: that imports tests/conftest.py, which imports
        # pytest, and the image installs requirements.txt only. Putting
        # test dependencies in the image to test the image is the wrong
        # trade, so this checks the entrypoint loads and argparse works.
        run: docker run --rm warship-harness python run.py --help

      - name: A missing mission fails cleanly, not with a traceback
        run: |
          out=$(docker run --rm warship-harness \
                  python run.py missions/nope 2>&1) && status=0 || status=$?
          echo "$out"
          [ "$status" -eq 1 ] || { echo "::error::expected exit 1"; exit 1; }
          case "$out" in
            *"no mission brief"*) ;;
            *) echo "::error::unexpected failure output"; exit 1 ;;
          esac

      - name: The agent cannot write outside its workspace
        # The claim the container is there to make. If a non-root agent
        # can write to /etc, the boundary is not doing its job.
        run: |
          if docker run --rm warship-harness \
               sh -c 'echo x > /etc/passwd' 2>/dev/null; then
            echo "::error::container user can write to /etc"
            exit 1
          fi
          echo "confirmed: /etc is not writable by the agent user"

  ci-ok:
    name: CI passed
    if: always()
    needs: [lint, test, container]
    runs-on: ubuntu-latest
    steps:
      # needs.*.result covers every job listed above, so adding a job
      # means editing `needs` and nothing else. Naming jobs individually
      # here meant a new job could fail while this one still reported
      # success.
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::a required job did not succeed"
          exit 1
      - run: echo "all green"
